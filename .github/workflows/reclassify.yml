name: 重新分类「未分类」记忆

# 手动触发: 调服务端 /api/reclassify/uncategorized, 用当前 AI 配置给「未分类」记忆重新分类(只改领域和标签, 不动激活时间)。
# 用的是和每日备份相同的 Variable OMBRE_BACKUP_URL 与 Secret OMBRE_ADMIN_TOKEN。
# 重复运行是安全的: 只处理仍是「未分类」的记忆。
# 服务端在后台跑; 这里每 30 秒查一次进度, 最多等 85 分钟。Render 若中途重启, 再跑一次即可。

on:
  workflow_dispatch:
    inputs:
      pause:
        description: "两次 AI 调用之间停几秒(免费档每分钟约 10 次; 太快会被 429 限流)"
        default: "6.5"
      limit:
        description: "这次最多处理几条(0=全部)。留点额度给日常聊天"
        default: "100"

jobs:
  reclassify:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Start and follow reclassify
        env:
          BASE_URL: ${{ vars.OMBRE_BACKUP_URL }}
          ADMIN_TOKEN: ${{ secrets.OMBRE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_URL" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::需要 Variable OMBRE_BACKUP_URL 和 Secret OMBRE_ADMIN_TOKEN"; exit 1
          fi
          URL="${BASE_URL%/}/api/reclassify/uncategorized"
          START_URL="$URL?pause=${{ inputs.pause }}&limit=${{ inputs.limit }}"
          curl -sS --retry 3 --retry-delay 20 --max-time 90 -X POST -H "X-Admin-Token: $ADMIN_TOKEN" "$START_URL"; echo
          for i in $(seq 170); do
            sleep 30
            body=$(curl -sS --retry 3 --retry-delay 10 --max-time 60 -H "X-Admin-Token: $ADMIN_TOKEN" "$URL" || echo '{}')
            echo "$body"
            if echo "$body" | grep -q '"running": *false'; then
              if echo "$body" | grep -q '"finished_at": *""'; then
                echo "::error::重新分类没有在运行也没有完成记录（服务可能重启了），请重新运行本 workflow"; exit 1
              fi
              echo "完成"; exit 0
            fi
          done
          echo "::error::85 分钟内没跑完"; exit 1
