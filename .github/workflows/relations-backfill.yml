name: 补建存量记忆的桶间关系

# 手动触发的一次性任务: 调服务端 /api/relations/backfill, 给存量记忆补建自动关系(上游 3.2.0 只对新建记忆推断)。
# 用的是和每日备份相同的 Variable OMBRE_BACKUP_URL 与 Secret OMBRE_ADMIN_TOKEN。
# 重复运行是安全的: 已有关系(包括手动改过的)不会被改写。
# 服务端在后台跑; 这里每 30 秒查一次进度, 最多等 60 分钟。Render 若中途重启, 再跑一次即可。

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Start and follow backfill
        env:
          BASE_URL: ${{ vars.OMBRE_BACKUP_URL }}
          ADMIN_TOKEN: ${{ secrets.OMBRE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_URL" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::需要 Variable OMBRE_BACKUP_URL 和 Secret OMBRE_ADMIN_TOKEN"; exit 1
          fi
          URL="${BASE_URL%/}/api/relations/backfill"
          curl -sS --retry 3 --retry-delay 20 --max-time 90 -X POST -H "X-Admin-Token: $ADMIN_TOKEN" "$URL"; echo
          for i in $(seq 120); do
            sleep 30
            body=$(curl -sS --retry 3 --retry-delay 10 --max-time 60 -H "X-Admin-Token: $ADMIN_TOKEN" "$URL" || echo '{}')
            echo "$body"
            if echo "$body" | grep -q '"running": *false'; then
              if echo "$body" | grep -q '"finished_at": *""'; then
                echo "::error::回填没有在运行也没有完成记录（服务可能重启了），请重新运行本 workflow"; exit 1
              fi
              echo "完成"; exit 0
            fi
          done
          echo "::error::60 分钟内没跑完"; exit 1
